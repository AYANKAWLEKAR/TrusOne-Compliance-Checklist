[project]
name = "trusone-backend"
version = "0.1.0"
description = "FastAPI backend for the Chemical Compliance MVP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "openai>=1.75.0",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.8.0",
  "python-dateutil>=2.9.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.40",
  "tenacity>=9.0.0",
  "tiktoken>=0.9.0",
  "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.0",
  "ruff>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: exercises live infrastructure such as PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
